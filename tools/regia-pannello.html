<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regia d'aula — pannello</title>
<style>
:root{
  --bg:#0d0f14;--bg-2:#141821;--bg-3:#1b2030;--line:#262d3d;--line-2:#333c52;
  --tx:#e6e9f0;--tx-2:#a2acc2;--tx-3:#6d7891;--ac:#5eead4;--amb:#ffb547;--ok:#4ade80;--no:#f87171;
  --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.6}
header{border-bottom:1px solid var(--line);background:var(--bg-2);padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:15px;margin:0;letter-spacing:.3px}
header .tag{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--amb);font-weight:700;
  border:1px solid var(--amb);border-radius:20px;padding:3px 10px}
header .sp{flex:1}
main{display:grid;grid-template-columns:270px 1fr;gap:0;min-height:calc(100vh - 55px)}
@media(max-width:860px){main{grid-template-columns:1fr}}
aside{border-right:1px solid var(--line);background:var(--bg-2);padding:16px}
aside h2,section h2{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--ac);font-weight:700;margin:0 0 12px}
.pg{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;
  color:var(--tx-2);font:inherit;padding:9px 11px;cursor:pointer;margin-bottom:3px}
.pg:hover{background:var(--bg-3);color:var(--tx)}
.pg.on{background:var(--bg-3);border-color:var(--ac);color:var(--tx)}
.pg small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--tx-3);margin-top:2px}
.pg .n{display:inline-block;background:var(--amb);color:#0d0f14;font-size:10px;font-weight:800;
  border-radius:10px;padding:0 6px;margin-left:6px;vertical-align:middle}
section{padding:22px 26px;max-width:1000px}
.riga{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
label{font-size:12px;color:var(--tx-2);font-weight:600}
input[type=text],select,textarea{background:var(--bg-2);border:1px solid var(--line-2);color:var(--tx);
  font:inherit;border-radius:8px;padding:8px 11px}
input[type=text]{font-family:var(--mono);font-size:13px;min-width:230px}
select{min-width:260px}
textarea{width:100%;min-height:320px;font-family:var(--mono);font-size:13px;line-height:1.65;resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--ac)}
button{background:var(--bg-2);border:1px solid var(--line-2);color:var(--tx-2);font:inherit;font-size:13px;
  font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--ac);color:var(--ac)}
button.primario{background:var(--ac);border-color:var(--ac);color:#08131a}
button.primario:hover{opacity:.88;color:#08131a}
button.rischio:hover{border-color:var(--no);color:var(--no)}
button:disabled{opacity:.4;cursor:not-allowed}
.barra{display:flex;gap:4px;flex-wrap:wrap;align-items:center;background:var(--bg-3);
  border:1px solid var(--line-2);border-bottom:none;border-radius:10px 10px 0 0;padding:6px}
.barra button{padding:5px 10px;font-size:12.5px;border-color:transparent;background:transparent}
.barra button:hover{background:var(--bg-2);border-color:var(--line-2)}
.barra button.on{background:var(--ac);border-color:var(--ac);color:#08131a}
.barra .div{width:1px;height:20px;background:var(--line-2);margin:0 4px}
.barra .sp{flex:1}
.barra b{font-weight:800}.barra i{font-style:italic}
.tela{background:var(--bg-2);border:1px solid var(--line-2);border-top:none;border-radius:0 0 10px 10px;
  padding:16px 20px;min-height:340px;overflow:auto}
.tela .dt{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--amb);font-weight:700;
  margin-bottom:10px;user-select:none}
.tela [contenteditable]{outline:none;min-height:280px;font-size:14px}
.tela [contenteditable]:empty:before{content:attr(data-vuoto);color:var(--tx-3)}
.tela p{margin:0 0 10px}.tela ol,.tela ul{margin:0 0 10px 20px}.tela li{margin-bottom:4px}
.tela strong{color:var(--tx)}.tela code{font-family:var(--mono);font-size:12.5px;color:var(--ac)}
#sorgente{width:100%;min-height:340px;border-radius:0 0 10px 10px;border-top:none}
.aiuto{font-size:12px;color:var(--tx-3);margin:6px 0 0}
.avviso{border-left:3px solid var(--amb);background:rgba(255,181,71,.07);padding:10px 14px;border-radius:0 8px 8px 0;
  font-size:13px;margin-bottom:14px}
.log{font-family:var(--mono);font-size:12px;white-space:pre-wrap;background:#090b0f;border:1px solid var(--line);
  border-radius:8px;padding:12px 14px;color:var(--tx-2);margin-top:14px;max-height:170px;overflow:auto}
.log.ko{border-color:var(--no);color:var(--no)}
.log.ok{border-color:var(--ok)}
.vuoto{color:var(--tx-3);font-size:13px}
.brm{position:fixed;right:0;bottom:0;left:0;background:var(--bg-2);border-top:1px solid var(--line);
  padding:10px 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
main{padding-bottom:64px}
.brm .sp{flex:1}
.st{font-size:12px;color:var(--tx-3)}
.spento{max-width:720px;margin:8px auto 0}
.spento h3{font-size:19px;margin:0 0 10px;color:var(--tx)}
.spento p{color:var(--tx-2);margin:0 0 14px}
.spento ol{color:var(--tx-2);margin:0 0 16px 20px}.spento li{margin-bottom:8px}
.cmd{display:flex;gap:8px;align-items:center;background:#090b0f;border:1px solid var(--line-2);
  border-radius:8px;padding:12px 14px;margin:10px 0 18px}
.cmd code{flex:1;font-family:var(--mono);font-size:13px;color:var(--ac);user-select:all}
.perche{border-left:3px solid var(--amb);background:rgba(255,181,71,.06);padding:12px 16px;
  border-radius:0 8px 8px 0;font-size:13px;color:var(--tx-2)}
</style>
</head>
<body>

<header>
  <h1>Regia d'aula</h1>
  <span class="tag">pannello locale</span>
  <span class="sp"></span>
  <span class="st">solo su questo computer · niente di tutto ciò viene pubblicato</span>
</header>

<main>
  <aside>
    <h2>Pagine</h2>
    <div id="elenco"><p class="vuoto">carico…</p></div>
  </aside>

  <section id="editor">
    <p class="vuoto">Scegli una pagina a sinistra.</p>
  </section>
</main>

<div class="brm">
  <button id="b-una" class="primario" disabled>Ricostruisci questa pagina</button>
  <button id="b-tutte">Ricostruisci tutte</button>
  <span class="sp"></span>
  <span class="st" id="st-build">le copie docente si chiamano <code>*.docente.html</code> e restano fuori da git</span>
</div>

<script>
const $ = s => document.querySelector(s);
let pagine = [], corrente = null, notaAperta = null;
let idAuto = true;   // l'id segue la sezione finché non lo scrivi a mano

const esc = t => t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const chiave = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50) || 'nota';

async function api(rotta, dati){
  const r = await fetch(rotta, dati ? {method:'POST', headers:{'Content-Type':'application/json'},
                                       body:JSON.stringify(dati)} : undefined);
  const j = await r.json();
  if(j.errore) throw new Error(j.errore);
  return j;
}

async function carica(){
  pagine = await api('/api/pagine');
  $('#elenco').innerHTML = pagine.map(p => `
    <button class="pg" data-f="${p.file}">
      ${esc(p.titolo.split('—')[0].trim())}
      ${Object.keys(p.note).length ? `<span class="n">${Object.keys(p.note).length}</span>` : ''}
      <small>${p.file}</small>
    </button>`).join('');
  document.querySelectorAll('.pg').forEach(b =>
    b.onclick = () => apri(pagine.find(p => p.file === b.dataset.f)));
}

function apri(p, idNota){
  corrente = p;
  document.querySelectorAll('.pg').forEach(b => b.classList.toggle('on', b.dataset.f === p.file));
  $('#b-una').disabled = false;

  const conNota = p.sezioni.filter(s => s.nota);
  const ids = Object.keys(p.note);
  // idNota assente = apri la prima; idNota null = foglio bianco per una nota nuova
  notaAperta = idNota === undefined ? (ids[0] || null) : (idNota || null);

  $('#editor').innerHTML = `
    <h2>${esc(p.file)}</h2>
    ${p.orfane.length ? `<div class="avviso"><strong>Note senza segnaposto:</strong>
       ${p.orfane.map(esc).join(', ')} — assegna loro una sezione, altrimenti non finiscono nella copia docente.</div>` : ''}

    <div class="riga">
      <label for="sel-nota">Nota</label>
      <select id="sel-nota">
        ${ids.map(i => `<option value="${i}" ${i === notaAperta ? 'selected':''}>${esc(i)}</option>`).join('')}
        <option value="">＋ nuova nota…</option>
      </select>
      <label for="sel-sez">va in fondo alla sezione</label>
      <select id="sel-sez">
        ${p.sezioni.map(s => `<option value="${s.id}">${esc(s.titolo)}${s.nota && s.nota !== notaAperta ? ' — occupata' : ''}</option>`).join('')}
      </select>
      <label for="in-id">id</label>
      <input type="text" id="in-id" value="${notaAperta ? esc(notaAperta) : ''}" placeholder="es. dimensiona-il-tuo-caso">
    </div>

    <h2>Testo della nota</h2>
    <div class="barra" id="barra">
      <button data-cmd="bold" title="Grassetto (Cmd+B)"><b>B</b></button>
      <button data-cmd="italic" title="Corsivo (Cmd+I)"><i>I</i></button>
      <button data-cmd="formatBlock" data-arg="p" title="Paragrafo">¶</button>
      <span class="div"></span>
      <button data-cmd="insertUnorderedList" title="Elenco puntato">• elenco</button>
      <button data-cmd="insertOrderedList" title="Elenco numerato">1. elenco</button>
      <span class="div"></span>
      <button data-cmd="removeFormat" title="Togli la formattazione">pulisci</button>
      <span class="sp"></span>
      <button id="b-html" title="Passa al codice HTML e viceversa">vista HTML</button>
    </div>
    <div class="tela" id="tela">
      <div class="dt">Nota per chi conduce</div>
      <div contenteditable="true" id="visuale" spellcheck="true"
           data-vuoto="Scrivi qui la regia: cosa chiedere alla stanza, dove fermarsi, quanto tempo…"></div>
    </div>
    <textarea id="sorgente" spellcheck="false" hidden></textarea>
    <p class="aiuto">Il titolo «Nota per chi conduce» e la cornice ambrata le mette il generatore: qui scrivi solo il contenuto.</p>

    <div class="riga" style="margin-top:16px">
      <button class="primario" id="b-salva">Salva e metti il segnaposto</button>
      <button id="b-salva-build">Salva e ricostruisci</button>
      <span class="sp"></span>
      <button class="rischio" id="b-elimina" ${notaAperta ? '' : 'disabled'}>Elimina questa nota</button>
    </div>
    <div class="log" id="log" hidden></div>`;

  const sez = $('#sel-sez');
  const suaSezione = conNota.find(s => s.nota === notaAperta);
  if(suaSezione) sez.value = suaSezione.id;

  scriviEditor(notaAperta ? p.note[notaAperta] : '');
  collegaEditor();

  $('#sel-nota').onchange = e => apri(corrente, e.target.value || null);
  $('#sel-sez').onchange = proponiId;

  // scrivendo nell'id prendi il comando; svuotandolo torna a seguire la sezione
  $('#in-id').oninput = e => { idAuto = !e.target.value.trim(); };
  $('#in-id').onblur = e => {
    if(e.target.value.trim()) e.target.value = chiave(e.target.value);
    else { idAuto = true; proponiId(); }
  };

  idAuto = !notaAperta;          // una nota esistente tiene il suo id
  proponiId();
  $('#b-salva').onclick = () => salva(false);
  $('#b-salva-build').onclick = () => salva(true);
  $('#b-elimina').onclick = elimina;
}

/* ---------- editor visuale, con passaggio al codice ---------- */
let vistaHtml = false;

const AMMESSI = ['P','STRONG','B','EM','I','UL','OL','LI','BR','CODE','A','H4'];

function ripulisci(radice){
  radice.querySelectorAll('*').forEach(el => {
    if(!AMMESSI.includes(el.tagName)){        // div, span, font... diventano il loro contenuto
      const p = el.parentNode;
      while(el.firstChild) p.insertBefore(el.firstChild, el);
      p.removeChild(el);
      return;
    }
    [...el.attributes].forEach(a => {
      if(!(el.tagName === 'A' && a.name === 'href')) el.removeAttribute(a.name);
    });
    if(el.tagName === 'B'){ el.outerHTML = '<strong>' + el.innerHTML + '</strong>'; }
    if(el.tagName === 'I'){ el.outerHTML = '<em>' + el.innerHTML + '</em>'; }
  });
  return radice;
}

function impagina(html){          // una riga per tag di primo livello, comodo da leggere
  return html.replace(/></g, '>\n<').replace(/\n(<\/(li|strong|em|code|a)>)/g, '$1').trim();
}

function leggiEditor(){
  if(vistaHtml) return $('#sorgente').value.trim();
  const d = document.createElement('div');
  d.innerHTML = $('#visuale').innerHTML;
  return impagina(ripulisci(d).innerHTML.replace(/<br>\s*(?=<\/p>)/g, ''));
}

function scriviEditor(html){
  $('#visuale').innerHTML = html || '';
  $('#sorgente').value = html || '';
}

function collegaEditor(){
  try{ document.execCommand('defaultParagraphSeparator', false, 'p'); }catch(_){}

  $('#barra').querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => {
    if(vistaHtml) return;
    $('#visuale').focus();
    document.execCommand(b.dataset.cmd, false, b.dataset.arg || null);
    statoBarra();
  });
  $('#visuale').addEventListener('keyup', statoBarra);
  $('#visuale').addEventListener('mouseup', statoBarra);

  $('#b-html').onclick = () => {
    if(vistaHtml){                       // dal codice al visuale
      $('#visuale').innerHTML = $('#sorgente').value;
      vistaHtml = false;
    } else {                             // dal visuale al codice
      $('#sorgente').value = leggiEditor();
      vistaHtml = true;
    }
    $('#tela').hidden = vistaHtml;
    $('#sorgente').hidden = !vistaHtml;
    $('#b-html').classList.toggle('on', vistaHtml);
    $('#b-html').textContent = vistaHtml ? 'vista testo' : 'vista HTML';
    $('#barra').querySelectorAll('[data-cmd]').forEach(b => b.disabled = vistaHtml);
  };
}

function statoBarra(){
  $('#barra').querySelectorAll('[data-cmd]').forEach(b => {
    try{ b.classList.toggle('on', document.queryCommandState(b.dataset.cmd)); }catch(_){}
  });
}

// se l'id e' vuoto lo propone dal titolo della sezione scelta
function proponiId(){
  const campo = $('#in-id');
  if(!idAuto) return;                    // l'hai scritto tu: non lo tocco
  const sel = $('#sel-sez');
  const titolo = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : '';
  campo.value = chiave(titolo.replace('— occupata','').replace(/—/g,'').trim() || 'nota');
}

function mostra(testo, ok){
  const l = $('#log');
  l.hidden = false; l.textContent = testo;
  l.className = 'log ' + (ok ? 'ok' : 'ko');
}

async function salva(anche_build){
  const id = chiave($('#in-id').value || 'nota');
  const testo = leggiEditor();
  if(!testo) return mostra('La nota è vuota: niente da salvare.', false);
  try{
    const p = await api('/api/nota', {
      file: corrente.file, id, sezione: $('#sel-sez').value,
      testo, id_precedente: notaAperta || null
    });
    pagine = pagine.map(x => x.file === p.file ? p : x);
    apri(p, id);
    mostra(`Salvata «${id}» e segnaposto messo in fondo alla sezione scelta.`, true);
    if(anche_build) await costruisci(corrente.file);
  }catch(e){ mostra(String(e.message), false); }
}

async function elimina(){
  if(!notaAperta || !confirm(`Elimino la nota «${notaAperta}» e il suo segnaposto?`)) return;
  try{
    const p = await api('/api/nota/elimina', {file: corrente.file, id: notaAperta});
    pagine = pagine.map(x => x.file === p.file ? p : x);
    await carica();
    apri(p);
    mostra('Nota eliminata.', true);
  }catch(e){ mostra(String(e.message), false); }
}

async function costruisci(file){
  $('#st-build').textContent = 'costruisco…';
  try{
    const r = await api('/api/costruisci', file ? {file} : {});
    $('#st-build').textContent = r.ok ? 'fatto' : 'errore';
    mostra(r.log || '(nessun output)', r.ok);
  }catch(e){ $('#st-build').textContent = 'errore'; mostra(String(e.message), false); }
}

$('#b-una').onclick = () => corrente && costruisci(corrente.file);
$('#b-tutte').onclick = () => costruisci(null);

function serverSpento(motivo){
  $('#elenco').innerHTML = '<p class="vuoto">nessuna pagina: il server non risponde</p>';
  $('#b-una').disabled = true;
  $('#b-tutte').disabled = true;
  $('#st-build').textContent = 'server non in esecuzione';
  $('#editor').innerHTML = `
    <div class="spento">
      <h3>Il pannello ha bisogno del suo server</h3>
      <p>Questa pagina scrive file sul tuo computer — le note di regia e i segnaposto nelle pagine —
         e un browser da solo non può farlo. Il server fa quel lavoro, gira solo qui in locale
         e non viene mai pubblicato.</p>
      <ol>
        <li>Apri il Terminale nella cartella del progetto.</li>
        <li>Lancia il comando qui sotto.</li>
        <li>Il pannello si apre da solo su <code>http://127.0.0.1:8765/</code>. Chiudi pure questa scheda.</li>
      </ol>
      <div class="cmd">
        <code id="cmd">python3 tools/regia-server.py</code>
        <button id="b-copia">copia</button>
      </div>
      <p class="perche"><strong>Perché vedevi un errore.</strong> ${esc(motivo)} —
         stai aprendo il file direttamente dal disco, oppure il server è stato chiuso con Ctrl+C.
         Riavvialo e ricarica.</p>
      <p style="margin-top:16px"><button id="b-riprova">Riprova adesso</button></p>
    </div>`;
  $('#b-copia').onclick = function(){
    const t = $('#cmd').textContent;
    const fatto = () => { this.textContent = 'copiato'; setTimeout(() => this.textContent = 'copia', 1600); };
    if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(fatto).catch(fatto);
    else { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
           ta.select(); try{ document.execCommand('copy'); fatto(); }catch(_){} document.body.removeChild(ta); }
  };
  $('#b-riprova').onclick = avvia;
}

function avvia(){
  if(location.protocol === 'file:')          // da disco le chiamate non partono nemmeno
    return serverSpento('La pagina è aperta come file locale (file://).');
  carica().catch(e => serverSpento(e.message || 'Il server non ha risposto.'));
}

avvia();
</script>
</body>
</html>
